ence applied</text><text x="88" y="568" fill="#f4f4ff" font-family="Arial" font-size="14">✓ Colours and logo rules applied</text><rect x="88" y="610" width="338" height="48" rx="12" fill="url(#g)"/><text x="190" y="640" fill="white" font-family="Arial" font-size="15" font-weight="700">BUILD PACKAGE</text><text x="496" y="145" fill="#a78bfa" font-family="Arial" font-size="13" letter-spacing="2">FINISHED OUTPUTS</text><rect x="496" y="172" width="286" height="286" rx="18" fill="url(#p)"/><text x="524" y="214" fill="white" font-family="Arial" font-size="13">SOCIAL POST</text><text x="524" y="333" fill="white" font-family="Arial" font-size="34" font-weight="800">Create less.</text><text x="524" y="372" fill="white" font-family="Arial" font-size="34" font-weight="800">Publish better.</text><rect x="814" y="172" width="286" height="170" rx="18" fill="#171c31" stroke="#393966"/><text x="838" y="209" fill="#ffc857" font-family="Arial" font-size="13">CAROUSEL · 7 SLIDES</text><text x="838" y="259" fill="#f4f4ff" font-family="Arial" font-size="27" font-weight="700">A complete idea,</text><text x="838" y="294" fill="#f4f4ff" font-family="Arial" font-size="27" font-weight="700">one slide at a time.</text><rect x="814" y="370" width="286" height="242" rx="18" fill="#111124" stroke="#393966"/><rect x="839" y="395" width="94" height="168" rx="12" fill="url(#g)"/><circle cx="886" cy="465" r="27" fill="#ffc857"/><path d="M876 450l26 15-26 15z" fill="#171732"/><text x="957" y="417" fill="#38bdf8" font-family="Arial" font-size="13">REEL · 00:30</text><text x="957" y="460" fill="#f4f4ff" font-family="Arial" font-size="18" font-weight="700">Narration</text><text x="957" y="489" fill="#f4f4ff" font-family="Arial" font-size="18" font-weight="700">Captions</text><text x="957" y="518" fill="#f4f4ff" font-family="Arial" font-size="18" font-weight="700">Final MP4</text><rect x="496" y="632" width="604" height="46" rx="12" fill="#163c35"/><text x="673" y="661" fill="#4ade80" font-family="Arial