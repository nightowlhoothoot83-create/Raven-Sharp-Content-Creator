name: Test and Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install backend dependencies
      run: pip install -r backend/requirements.txt

    - name: Sanity-import the backend app and production extensions
      working-directory: backend
      env:
        MONGO_URL: "mongodb://localhost:27017/ci_dummy"
      run: |
        python -c "import server; print('server.py imports cleanly')"
        python -c "import app_v2; print('app_v2.py imports cleanly')"
        python -c "import production_app; print('production_app.py imports cleanly')"
        python -m py_compile server.py app_v2.py production_app.py

    - name: Boot v2 app and verify HTTP health
      working-directory: backend
      env:
        MONGO_URL: "mongodb://localhost:27017/ci_dummy"
        PORT: "8765"
      run: |
        uvicorn app_v2:app --host 127.0.0.1 --port 8765 > /tmp/raven-uvicorn.log 2>&1 &
        PID=$!
        trap 'kill $PID 2>/dev/null || true; cat /tmp/raven-uvicorn.log' EXIT
        for i in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:8765/health | grep -q 'ok'; then
            echo "v2 app booted and /health returned OK"
            exit 0
          fi
          if ! kill -0 $PID 2>/dev/null; then
            echo "uvicorn exited before becoming healthy"
            exit 1
          fi
          sleep 1
        done
        echo "v2 app did not become healthy in time"
        exit 1

    - name: Smoke-test finished asset renderer and FFmpeg
      working-directory: backend
      env:
        MONGO_URL: "mongodb://localhost:27017/ci_dummy"
      run: |
        python - <<'PY'
        import asyncio, tempfile
        from pathlib import Path
        from PIL import Image
        import imageio_ffmpeg
        import app_v2

        png = asyncio.run(app_v2._brand_canvas(
            {"name":"CI Brand","primary_color":"#7c5cbf","secondary_color":"#38bdf8"},
            640, 640, "Finished content test", "Exact text overlay", "CI Brand", ["A", "B"], None
        ))
        image = Image.open(__import__('io').BytesIO(png))
        assert image.size == (640, 640)
        with tempfile.TemporaryDirectory() as td:
            overlay = Path(td) / "caption.png"
            app_v2._caption_overlay(720, 1280, "Caption test", {}, overlay)
            assert overlay.exists() and overlay.stat().st_size > 0
        ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
        assert Path(ffmpeg).exists(), ffmpeg
        print("Renderer and FFmpeg smoke tests passed")
        PY
