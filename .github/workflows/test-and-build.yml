name: Test and Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install backend dependencies
      run: pip install -r backend/requirements.txt

    - name: Sanity-import the backend app and production extensions
      working-directory: backend
      env:
        MONGO_URL: "mongodb://localhost:27017/ci_dummy"
      run: |
        python -c "import server; print('server.py imports cleanly')"
        python -c "import app_v2; print('app_v2.py imports cleanly')"
        python -c "import production_app; print('production_app.py imports cleanly')"
        python -m py_compile server.py app_v2.py production_app.py

    - name: Smoke-test finished asset renderer and FFmpeg
      working-directory: backend
      env:
        MONGO_URL: "mongodb://localhost:27017/ci_dummy"
      run: |
        python - <<'PY'
        import asyncio, tempfile
        from pathlib import Path
        from PIL import Image
        import imageio_ffmpeg
        import app_v2
        import production_app

        assert production_app._extract_json('{"ok": true}') == {"ok": True}
        png = asyncio.run(app_v2._brand_canvas(
            {"name":"CI Brand","primary_color":"#7c5cbf","secondary_color":"#38bdf8"},
            640, 640, "Finished content test", "Exact text overlay", "CI Brand", ["A", "B"], None
        ))
        image = Image.open(__import__('io').BytesIO(png))
        assert image.size == (640, 640)
        with tempfile.TemporaryDirectory() as td:
            overlay = Path(td) / "caption.png"
            app_v2._caption_overlay(720, 1280, "Caption test", {}, overlay)
            assert overlay.exists() and overlay.stat().st_size > 0
        ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
        assert Path(ffmpeg).exists(), ffmpeg
        print("Production planner, renderer and FFmpeg smoke tests passed")
        PY
